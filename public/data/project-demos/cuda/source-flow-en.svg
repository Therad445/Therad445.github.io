   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #293b35" x="59.04" y="41.76" transform="rotate(-0 59.04 41.76)">Where the GPU fits</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #65706b" x="59.04" y="65.952" transform="rotate(-0 59.04 65.952)">CUDA kNN regression · source-based execution flow</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #293b35" x="76.32" y="135.779187" transform="rotate(-0 76.32 135.779187)">1  CPU → GPU</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #65706b" transform="translate(76.32 165.938391)">Training features N × D and query features Q × D</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #65706b" transform="translate(76.32 181.385333)">Host-to-device copy; targets stay on the CPU</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #293b35" x="76.32" y="245.219187" transform="rotate(-0 76.32 245.219187)">2  GPU distance kernel</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #65706b" transform="translate(76.32 275.378391)">Squared Euclidean distance for every query/training pair</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #65706b" transform="translate(76.32 290.825333)">Naive loop or shared-memory tiling; 16 × 16 threads</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #293b35" x="76.32" y="354.659187" transform="rotate(-0 76.32 354.659187)">3  GPU → CPU</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #65706b" transform="translate(76.32 384.818391)">Full Q × N float32 distance matrix</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #65706b" transform="translate(76.32 400.265333)">Device-to-host copy: 4QN bytes</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #293b35" x="76.32" y="464.048406" transform="rotate(-0 76.32 464.048406)">4  CPU neighbour selection</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #65706b" transform="translate(76.32 494.258391)">nth_element selects k neighbours per query</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #65706b" transform="translate(76.32 509.991802)">Prediction = mean of their target values</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #293b35" x="59.04" y="547.488" transform="rotate(-0 59.04 547.488)">Memory grows with Q × N on both host and device.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #65706b" x="59.04" y="565.92" transform="rotate(-0 59.04 565.92)">Source inspection only. No GPU timing or speedup claimed.</text>
   </g>
  </g>
